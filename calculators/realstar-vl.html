<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RealStar Viral Load — Viro Calculator</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" href="../icon.png" type="image/png" />
  <meta name="theme-color" content="#0f4c81" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
  <div class="container">
    <a href="../index.html" class="back-link">← Back to Viro Calculator</a>
    <h1>Viro Calculator</h1>
    <p class="sub-text" style="margin-top:-10px; margin-bottom:14px; font-weight:600; color:var(--primary);">Altona RealStar® Viral Load</p>

    <!-- Extraction Method Selector -->
    <div class="field">
      <label for="methodSelect">Extraction Method Preset</label>
      <select id="methodSelect"></select>
    </div>

    <!-- Lock Volumes Checkbox -->
    <div class="checkbox-row">
      <input type="checkbox" id="lockVolumes" />
      <label for="lockVolumes" style="margin:0; font-weight:500;">Keep Sample & Elution volumes same for all runs</label>
    </div>

    <!-- Volume Inputs -->
    <div class="row">
      <div class="field">
        <label for="sampleVol">Sample Input (µL)</label>
        <input type="number" id="sampleVol" step="any" placeholder="e.g. 140" />
      </div>
      <div class="field">
        <label for="elutionVol">Elution Vol (µL)</label>
        <input type="number" id="elutionVol" step="any" placeholder="e.g. 60" />
      </div>
    </div>

    <!-- PCR Result Input -->
    <div class="field">
      <label for="pcrResult">PCR Result (IU/µL or copies/µL)</label>
      <input type="number" id="pcrResult" step="any" placeholder="Enter value & press Enter" autofocus />
    </div>

    <!-- Output Box -->
    <div class="result-box">
      <div class="sub">Viral Load</div>
      <div class="val" id="finalResult">0 IU/mL</div>
      <div class="sub" id="logResult">Log₁₀: —</div>
    </div>

    <!-- Quick Action Buttons -->
    <div class="action-row">
      <button type="button" id="copyBtn" onclick="copyAndLog()">Copy Result</button>
      <button type="button" class="secondary" onclick="nextSample()">Next Sample</button>
    </div>

    <!-- Recent History Panel -->
    <details id="historySection" open>
      <summary>Recent Runs (Last 5)</summary>
      <div id="historyList" class="history-list">
        <p class="sub-text" style="margin-top:8px;">No samples calculated yet.</p>
      </div>
      <button type="button" class="text-btn" onclick="clearHistory()">Clear History</button>
    </details>

    <!-- Manage Presets Section -->
    <details>
      <summary>Manage Extraction Methods & Defaults</summary>
      <h2>Add New Extraction Method</h2>
      <div class="field">
        <input type="text" id="newMethodName" placeholder="Method Name (e.g., AltoStar AM16)" />
      </div>
      <div class="row">
        <div class="field">
          <input type="number" id="newSampleVol" placeholder="Sample (µL)" />
        </div>
        <div class="field">
          <input type="number" id="newElutionVol" placeholder="Elution (µL)" />
        </div>
      </div>
      <button type="button" onclick="addMethod()">Save Method to Device</button>

      <h2>Saved Methods</h2>
      <div id="presetList"></div>
    </details>

    <div class="version-tag">Viro Calculator • v2.5 Live Sync</div>
  </div>

  <script>
    const DEFAULT_METHODS = [
      { id: 'default-1', name: 'QIAamp Mini (140 µL / 60 µL)', sample: 140, elution: 60 },
      { id: 'default-2', name: 'Standard (200 µL / 60 µL)', sample: 200, elution: 60 },
      { id: 'default-3', name: 'AltoStar AM16 (500 µL / 80 µL)', sample: 500, elution: 80 }
    ];

    let methods = JSON.parse(localStorage.getItem('virocalc_methods')) || DEFAULT_METHODS;
    let settings = JSON.parse(localStorage.getItem('virocalc_settings')) || {
      selectedMethodId: 'default-1',
      locked: false,
      sampleVol: 140,
      elutionVol: 60
    };
    let runHistory = JSON.parse(localStorage.getItem('virocalc_history')) || [];

    const methodSelect = document.getElementById('methodSelect');
    const lockCheckbox = document.getElementById('lockVolumes');
    const sampleInput = document.getElementById('sampleVol');
    const elutionInput = document.getElementById('elutionVol');
    const pcrInput = document.getElementById('pcrResult');
    const copyBtn = document.getElementById('copyBtn');

    let currentFormattedScreen = '';
    let currentFormattedPlain = '';
    let currentLog = '';
    let currentPcr = null;

    function saveState() {
      localStorage.setItem('virocalc_methods', JSON.stringify(methods));
      localStorage.setItem('virocalc_settings', JSON.stringify(settings));
      localStorage.setItem('virocalc_history', JSON.stringify(runHistory));
    }

    function renderMethods() {
      methodSelect.innerHTML = '';
      const presetList = document.getElementById('presetList');
      presetList.innerHTML = '';

      methods.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = `${m.name} (${m.sample}µL → ${m.elution}µL)`;
        if (m.id === settings.selectedMethodId) opt.selected = true;
        methodSelect.appendChild(opt);

        const div = document.createElement('div');
        div.className = 'preset-item';
        div.innerHTML = `<span><strong>${m.name}</strong><br>${m.sample} µL input / ${m.elution} µL elution</span>`;
        if (!m.id.startsWith('default-')) {
          const delBtn = document.createElement('button');
          delBtn.className = 'danger';
          delBtn.textContent = 'Delete';
          delBtn.onclick = () => deleteMethod(m.id);
          div.appendChild(delBtn);
        }
        presetList.appendChild(div);
      });
    }

    function renderHistory() {
      const historyList = document.getElementById('historyList');
      if (runHistory.length === 0) {
        historyList.innerHTML = '<p class="sub-text" style="margin-top:8px;">No samples calculated yet.</p>';
        return;
      }
      historyList.innerHTML = runHistory.map(item => `
        <div class="history-item">
          <div>
            <strong>Viral load- ${item.plain}</strong> <span class="badge">Log10: ${item.log}</span>
            <div class="history-meta">PCR: ${item.pcr} IU/µL (${item.vols}) • ${item.time}</div>
          </div>
        </div>
      `).join('');
    }

    function applyLockState() {
      lockCheckbox.checked = settings.locked;
      sampleInput.disabled = settings.locked;
      elutionInput.disabled = settings.locked;
      methodSelect.disabled = settings.locked;
      sampleInput.value = settings.sampleVol;
      elutionInput.value = settings.elutionVol;
      calculate();
    }

    function calculate() {
      const sVol = parseFloat(sampleInput.value);
      const eVol = parseFloat(elutionInput.value);
      const pcr = parseFloat(pcrInput.value);

      if (!sVol || !eVol || isNaN(pcr) || sVol <= 0) {
        document.getElementById('finalResult').textContent = '0 IU/mL';
        document.getElementById('logResult').textContent = 'Log₁₀: —';
        currentFormattedScreen = '';
        currentFormattedPlain = '';
        currentLog = '';
        currentPcr = null;
        return;
      }

      const viralLoad = (pcr * eVol * 1000) / sVol;
      const logVal = viralLoad > 0 ? Math.log10(viralLoad).toFixed(2) : '—';

      let screenResult = '';
      let plainResult = '';

      if (viralLoad < 1000) {
        const valStr = `${Math.round(viralLoad).toLocaleString('en-IN')} IU/mL`;
        screenResult = valStr;
        plainResult = valStr;
      } else {
        const exponent = Math.floor(Math.log10(viralLoad));
        const coefficient = (viralLoad / Math.pow(10, exponent)).toFixed(1);
        
        const superscripts = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
        const expStr = String(exponent).split('').map(char => superscripts[char] || char).join('');
        screenResult = `${coefficient} × 10${expStr} IU/mL`;

        plainResult = `${coefficient}*10^${exponent} IU/mL`;
      }

      currentFormattedScreen = screenResult;
      currentFormattedPlain = plainResult;
      currentLog = logVal;
      currentPcr = pcr;

      document.getElementById('finalResult').textContent = screenResult;
      document.getElementById('logResult').textContent = `Log₁₀: ${logVal}`;
    }

    function logRun() {
      if (!currentFormattedPlain || currentPcr === null) return;
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const entry = {
        plain: currentFormattedPlain,
        log: currentLog,
        pcr: currentPcr,
        vols: `${sampleInput.value}/${elutionInput.value}µL`,
        time: timeStr
      };
      if (runHistory.length === 0 || runHistory[0].pcr !== entry.pcr || runHistory[0].plain !== entry.plain) {
        runHistory.unshift(entry);
        if (runHistory.length > 5) runHistory.pop();
        saveState();
        renderHistory();
      }
    }

    function copyAndLog() {
      if (!currentFormattedPlain) return;
      logRun();
      const copyText = `Viral load- ${currentFormattedPlain}`;
      navigator.clipboard.writeText(copyText).then(() => {
        const origText = copyBtn.textContent;
        copyBtn.textContent = 'Copied ✓';
        copyBtn.style.background = '#15803d';
        setTimeout(() => {
          copyBtn.textContent = origText;
          copyBtn.style.background = '';
        }, 1200);
      });
    }

    function nextSample() {
      if (currentFormattedPlain) logRun();
      pcrInput.value = '';
      calculate();
      pcrInput.focus();
    }

    function clearHistory() {
      runHistory = [];
      saveState();
      renderHistory();
    }

    pcrInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        copyAndLog();
      }
    });

    methodSelect.addEventListener('change', (e) => {
      const chosen = methods.find(m => m.id === e.target.value);
      if (chosen) {
        settings.selectedMethodId = chosen.id;
        settings.sampleVol = chosen.sample;
        settings.elutionVol = chosen.elution;
        sampleInput.value = chosen.sample;
        elutionInput.value = chosen.elution;
        saveState();
        calculate();
      }
    });

    lockCheckbox.addEventListener('change', (e) => {
      settings.locked = e.target.checked;
      settings.sampleVol = parseFloat(sampleInput.value) || 140;
      settings.elutionVol = parseFloat(elutionInput.value) || 60;
      saveState();
      applyLockState();
    });

    [sampleInput, elutionInput].forEach(el => {
      el.addEventListener('input', () => {
        settings.sampleVol = parseFloat(sampleInput.value) || 0;
        settings.elutionVol = parseFloat(elutionInput.value) || 0;
        saveState();
        calculate();
      });
    });

    pcrInput.addEventListener('input', calculate);

    function addMethod() {
      const name = document.getElementById('newMethodName').value.trim();
      const sample = parseFloat(document.getElementById('newSampleVol').value);
      const elution = parseFloat(document.getElementById('newElutionVol').value);

      if (!name || !sample || !elution) return alert('Fill all fields');

      const newMethod = { id: 'custom-' + Date.now(), name, sample, elution };
      methods.push(newMethod);
      settings.selectedMethodId = newMethod.id;
      settings.sampleVol = sample;
      settings.elutionVol = elution;

      document.getElementById('newMethodName').value = '';
      document.getElementById('newSampleVol').value = '';
      document.getElementById('newElutionVol').value = '';

      saveState();
      renderMethods();
      applyLockState();
    }

    function deleteMethod(id) {
      methods = methods.filter(m => m.id !== id);
      if (settings.selectedMethodId === id) {
        settings.selectedMethodId = methods[0].id;
        settings.sampleVol = methods[0].sample;
        settings.elutionVol = methods[0].elution;
      }
      saveState();
      renderMethods();
      applyLockState();
    }

    renderMethods();
    renderHistory();
    applyLockState();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js');
    }
  </script>
</body>
</html>
