<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master Mix Prep — Viro Calculator</title>
  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" href="../icon.png" type="image/png" />
  <meta name="theme-color" content="#0f4c81" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body data-theme="mastermix">
  <div class="container">
    <a href="../index.html" class="back-link">← Back to Viro Calculator</a>
    <div class="page-head">
      <img src="../icon.png" alt="" />
      <div class="titles">
        <h1>Viro Calculator</h1>
        <span class="page-chip">Altona Master Mix Prep (Exact Reactions)</span>
      </div>
    </div>

    <!-- Total Reactions Input -->
    <div class="field">
      <label for="totalRxns">Total Reactions Required (Samples + Controls)</label>
      <input type="number" id="totalRxns" min="1" step="1" placeholder="e.g. 24" autofocus />
    </div>

    <!-- Vol per reaction configuration (Defaults: Master A = 5 µL, Master B = 15 µL) -->
    <div class="row">
      <div class="field">
        <label for="volA">Master A per rxn (µL)</label>
        <input type="number" id="volA" step="any" value="5" />
      </div>
      <div class="field">
        <label for="volB">Master B per rxn (µL)</label>
        <input type="number" id="volB" step="any" value="15" />
      </div>
    </div>

    <!-- Results Display -->
    <div class="result-box" style="text-align: left; padding: 18px;">
      <div style="font-weight: 700; margin-bottom: 12px; font-size: 1.05rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px;">
        Master Mix Preparation (Exact Volumes)
      </div>
      
      <div style="margin-bottom: 14px;">
        <div style="font-size: 0.85rem; opacity: 0.9;">Master A:</div>
        <div class="val" id="resA" style="font-size: 1.4rem;">0.0 µL</div>
        <div class="sub" id="tubesA">Tubes required: 0 (12 rxns/tube)</div>
      </div>

      <div>
        <div style="font-size: 0.85rem; opacity: 0.9;">Master B:</div>
        <div class="val" id="resB" style="font-size: 1.4rem;">0.0 µL</div>
        <div class="sub" id="tubesB">Tubes required: 0 (12 rxns/tube)</div>
      </div>
    </div>

    <div class="version-tag">Viro Calculator • v4.0</div>
  </div>

  <script>
    const rxnsInput = document.getElementById('totalRxns');
    const volAInput = document.getElementById('volA');
    const volBInput = document.getElementById('volB');

    function calculateMM() {
      const rxns = parseInt(rxnsInput.value) || 0;
      const vA = parseFloat(volAInput.value) || 0;
      const vB = parseFloat(volBInput.value) || 0;

      if (rxns <= 0 || vA <= 0 || vB <= 0) {
        document.getElementById('resA').textContent = '0.0 µL';
        document.getElementById('tubesA').textContent = 'Tubes required: 0 (12 rxns/tube)';
        document.getElementById('resB').textContent = '0.0 µL';
        document.getElementById('tubesB').textContent = 'Tubes required: 0 (12 rxns/tube)';
        return;
      }

      // Exact reactions calculation (No extra overage)
      const totalVolA = rxns * vA;
      const totalVolB = rxns * vB;

      const tubesNeeded = Math.ceil(rxns / 12);

      document.getElementById('resA').textContent = `${totalVolA.toFixed(1)} µL`;
      document.getElementById('tubesA').textContent = `Tubes required: ${tubesNeeded} tube(s)`;

      document.getElementById('resB').textContent = `${totalVolB.toFixed(1)} µL`;
      document.getElementById('tubesB').textContent = `Tubes required: ${tubesNeeded} tube(s)`;
    }

    [rxnsInput, volAInput, volBInput].forEach(el => {
      el.addEventListener('input', calculateMM);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js');
    }
  </script>
</body>
</html>
